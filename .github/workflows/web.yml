name: Web quality

on:
  push:
    paths:
      - 'apps/web/**'
      - 'contracts/**'
      - 'docs/contratos_modelo_datos.md'
      - 'services/**'
      - 'infra/local/**'
      - 'infra/reverse-proxy/**'
      - 'tests/integration/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'contracts/**'
      - 'docs/contratos_modelo_datos.md'
      - 'services/**'
      - 'infra/local/**'
      - 'infra/reverse-proxy/**'
      - 'tests/integration/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          run_install: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../../tests/integration/p1-domains/requirements.txt
      - run: python ../../contracts/generate.py --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - run: python ../../tests/integration/p1-domains/run.py --web
