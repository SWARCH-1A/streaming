name: Broker regression

on:
  push:
    branches: [main, develop]
    paths: ['infra/broker/**', 'infra/p1/**', 'infra/local/dev.py', 'compose.yaml', 'services/streaming/**', 'contracts/p2.json', '.github/workflows/broker.yml']
  pull_request:
    paths: ['infra/broker/**', 'infra/p1/**', 'infra/local/dev.py', 'compose.yaml', 'services/streaming/**', 'contracts/p2.json', '.github/workflows/broker.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-and-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s infra/p1 -p 'test_*.py'
      - run: python infra/broker/smoke_test.py
  streaming-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t streaming-broker-ci services/streaming
