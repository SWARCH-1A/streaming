name: Integrated P1 TLS
on:
  push:
    paths: ['services/**', 'apps/web/**', 'infra/**', 'contracts/**', 'tests/integration/**', '.github/workflows/p1-tls.yml']
  pull_request:
    paths: ['services/**', 'apps/web/**', 'infra/**', 'contracts/**', 'tests/integration/**', '.github/workflows/p1-tls.yml']
permissions:
  contents: read
concurrency:
  group: p1-tls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tls-recovery-and-replicas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
          run_install: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r tests/integration/p1-domains/requirements.txt
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web build
      - run: python infra/p1/manage.py init
      - run: python infra/p1/manage.py build
      - run: python infra/p1/manage.py up --replicas 2
      - name: Native TLS, persistence, decoded HLS, fail-closed Chat and restart recovery
        run: python tests/integration/p1-delivery/verify.py --confirm-disposable
      - name: Physical Core and Chat replicas share state and quotas
        run: python tests/integration/p1-delivery/replicas.py --confirm-disposable
      - name: Stop only the own disposable project
        if: always()
        run: |
          if test -f infra/p1/.state/owner.json; then
            python infra/p1/manage.py down
          fi
