# Explicit development HTTP edge; the HTTPS acceptance profile belongs to SPEC-13.
services:
  web-ssr:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
      WEB_API_UPSTREAM: http://core:8081
  web:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      WEB_UPSTREAM: http://web-ssr:3000
    depends_on: [web-ssr]
