services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Define CORE_DB_PASSWORD}
    ports:
      - "127.0.0.1:${CORE_DB_PORT:-5440}:5432"
    volumes:
      - core-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 3s
      retries: 12
  core:
    build:
      context: ../../services/core
    environment:
      CORE_DB_URL: jdbc:postgresql://postgres:5432/core
      CORE_DB_USER: core
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Define CORE_DB_PASSWORD}
      CORE_RATE_LIMIT_HMAC_SECRET: ${CORE_RATE_LIMIT_HMAC_SECRET:?Define CORE_RATE_LIMIT_HMAC_SECRET}
      CORE_SECURE_COOKIE: ${CORE_SECURE_COOKIE:-false}
      CORE_STREAMING_SERVICE_TOKEN: ${CORE_STREAMING_SERVICE_TOKEN:-}
      CORE_STREAMING_CATALOG_SERVICE_TOKEN: ${CORE_STREAMING_CATALOG_SERVICE_TOKEN:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      CORE_IMAGE_STORAGE_PROVIDER: ${CORE_IMAGE_STORAGE_PROVIDER:-s3}
      CORE_IMAGE_S3_BUCKET: ${CORE_IMAGE_S3_BUCKET:-}
      CORE_IMAGE_S3_REGION: ${CORE_IMAGE_S3_REGION:-us-east-1}
      CORE_IMAGE_S3_ENDPOINT: ${CORE_IMAGE_S3_ENDPOINT:-}
      CORE_IMAGE_S3_PATH_STYLE_ACCESS: ${CORE_IMAGE_S3_PATH_STYLE_ACCESS:-false}
      CORE_IMAGE_S3_AVATAR_PREFIX: ${CORE_IMAGE_S3_AVATAR_PREFIX:-avatars}
      CORE_IMAGE_S3_BANNER_PREFIX: ${CORE_IMAGE_S3_BANNER_PREFIX:-banners}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      PROFILE_AVATAR_STORAGE: /data/avatars
      PROFILE_AVATAR_PUBLIC_BASE: ${PROFILE_AVATAR_PUBLIC_BASE:-/api/profile/avatars}
      CHANNELS_BANNER_STORAGE: /data/banners
      CHANNELS_BANNER_PUBLIC_BASE: ${CHANNELS_BANNER_PUBLIC_BASE:-/api/channels/banners}
    ports:
      - "127.0.0.1:${CORE_PORT:-8081}:8081"
    volumes:
      - core-avatars:/data/avatars
      - core-banners:/data/banners
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  core-postgres:
  core-avatars:
  core-banners:
