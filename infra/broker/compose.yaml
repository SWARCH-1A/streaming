services:
  broker:
    image: rabbitmq:4.3.7-management@sha256:79fb281ef7e0a15e3c5e0e12e66e944cebbf14a129493ef464369abd2c48d01a
    hostname: broker
    environment:
      RABBITMQ_NODENAME: rabbit@broker
    volumes:
      - broker-data:/var/lib/rabbitmq
      - ./infra/broker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ${P1_STATE}/broker-definitions.json:/run/secrets/broker-definitions.json:ro
      - ${P1_STATE}/broker.crt:/run/secrets/broker.crt:ro
      - ${P1_STATE}/broker.key:/run/secrets/broker.key:ro
      - ${P1_STATE}/ca.crt:/run/secrets/ca.crt:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
  core:
    environment:
      CORE_EVENTS_TRANSPORT: amqp
      SPRING_RABBITMQ_HOST: broker
      SPRING_RABBITMQ_PORT: "5671"
      SPRING_RABBITMQ_VIRTUAL_HOST: streaming-p2
      SPRING_RABBITMQ_USERNAME: core
      SPRING_RABBITMQ_PASSWORD: ${BROKER_CORE_PASSWORD:?Run init --broker}
      SPRING_RABBITMQ_SSL_ENABLED: "true"
      SPRING_RABBITMQ_SSL_VALIDATE_SERVER_CERTIFICATE: "true"
      SPRING_RABBITMQ_SSL_VERIFY_HOSTNAME: "true"
      SPRING_RABBITMQ_SSL_TRUST_STORE: file:/run/secrets/truststore.p12
      SPRING_RABBITMQ_SSL_TRUST_STORE_PASSWORD: changeit
      SPRING_RABBITMQ_SSL_TRUST_STORE_TYPE: PKCS12
      SPRING_RABBITMQ_DYNAMIC: "false"
  live:
    environment:
      STREAMING_EVENTS_TRANSPORT: amqp
      STREAMING_BROKER_URL: amqps://streaming:${BROKER_STREAMING_PASSWORD:?Run init --broker}@broker:5671/streaming-p2?heartbeat=30
      STREAMING_BROKER_CA_FILE: /run/secrets/ca.crt
  chat:
    environment:
      CHAT_EVENTS_TRANSPORT: amqp
      CHAT_BROKER_URL: amqps://chat:${BROKER_CHAT_PASSWORD:?Run init --broker}@broker:5671/streaming-p2?heartbeat=30
      CHAT_BROKER_CA_FILE: /run/secrets/ca.crt
  broker-ops:
    profiles: [tools]
    build:
      context: ./infra/broker
      dockerfile: Dockerfile.operator
    environment:
      BROKER_OPERATOR_PASSWORD: ${BROKER_OPERATOR_PASSWORD:?Run init --broker}
    volumes:
      - ${P1_STATE}/ca.crt:/run/secrets/ca.crt:ro
      - broker-audit:/audit
volumes:
  broker-data:
  broker-audit:
