listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/ca.crt
ssl_options.certfile = /run/secrets/broker.crt
ssl_options.keyfile = /run/secrets/broker.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
management.tcp.port = none
management.ssl.port = 15671
management.ssl.cacertfile = /run/secrets/ca.crt
management.ssl.certfile = /run/secrets/broker.crt
management.ssl.keyfile = /run/secrets/broker.key
definitions.import_backend = local_filesystem
definitions.local.path = /run/secrets/broker-definitions.json
loopback_users.guest = true
disk_free_limit.absolute = 1GB
vm_memory_high_watermark.absolute = 512MiB
max_message_size = 65536
