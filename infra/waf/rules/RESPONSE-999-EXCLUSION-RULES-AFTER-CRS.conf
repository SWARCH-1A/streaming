# Local exclusions loaded after the OWASP CRS rules (ADR-031). Each exclusion removes the
# narrowest target that produced a verified false positive; no rule or path is disabled whole.
# Rule IDs for local rules use the 10000-19999 range.

# Passwords are hashed with Argon2id and never interpreted by any service. Strong passwords contain
# quotes, dashes, angle brackets and words that SQLi/XSS rules match, so the CRS does not inspect them.
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.password"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:json.newPassword"
