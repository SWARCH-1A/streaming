server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
spring:
  application:
    name: identity
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${IDENTITY_DB_USER:identity}
    password: ${IDENTITY_DB_PASSWORD:identity-local-only}
  flyway:
    schemas: identity
    default-schema: identity
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
identity:
  cookie-name: stream_session
  secure-cookie: ${IDENTITY_SECURE_COOKIE:false}
  public-origin: ${WEB_ORIGIN:http://localhost:3000}
  internal-service-tokens: ${IDENTITY_INTERNAL_SERVICE_TOKENS:profile=local-profile-token,channels=local-channels-token}
  channels-base-url: ${CHANNELS_INTERNAL_URL:http://localhost:8083}
  channels-service-token: ${IDENTITY_CHANNELS_TOKEN:local-channels-token}
  login-identifier-failures: 5
  login-ip-failures: 50
  registration-keys-per-ip: 10
  rate-limit-hmac-secret: ${IDENTITY_RATE_LIMIT_HMAC_SECRET:local-development-only-change-me}
