server:
  port: ${PORT:8083}
  forward-headers-strategy: framework
spring:
  application:
    name: channels
  datasource:
    url: ${CHANNELS_DB_URL:jdbc:postgresql://localhost:5432/channels}
    username: ${CHANNELS_DB_USER:channels}
    password: ${CHANNELS_DB_PASSWORD:channels-local-only}
  flyway:
    schemas: channels
    default-schema: channels
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
channels:
  secure-cookie: ${CHANNELS_SECURE_COOKIE:false}
  public-origin: ${WEB_ORIGIN:http://localhost:3000}
  identity-base-url: ${IDENTITY_INTERNAL_URL:http://localhost:8081}
  identity-service-token: ${CHANNELS_IDENTITY_TOKEN:local-channels-token}
  internal-service-tokens: ${CHANNELS_INTERNAL_SERVICE_TOKENS:identity=local-channels-token,streaming=local-streaming-channels-token}
  storage-root: ${CHANNELS_BANNER_STORAGE:./data/banners}
  banner-public-base-url: ${CHANNELS_BANNER_PUBLIC_BASE:/api/channels/banners}
