server:
  port: ${PORT:8081}
  forward-headers-strategy: none
spring:
  application:
    name: core
  datasource:
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/core}
    username: ${CORE_DB_USER:core}
    password: ${CORE_DB_PASSWORD}
  flyway:
    schemas: core,identity,profile,channels,taxonomy
    default-schema: core
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
core:
  images:
    storage-provider: ${CORE_IMAGE_STORAGE_PROVIDER:s3}
    s3:
      bucket: ${CORE_IMAGE_S3_BUCKET:}
      region: ${CORE_IMAGE_S3_REGION:us-east-1}
      endpoint: ${CORE_IMAGE_S3_ENDPOINT:}
      path-style-access: ${CORE_IMAGE_S3_PATH_STYLE_ACCESS:false}
      avatar-prefix: ${CORE_IMAGE_S3_AVATAR_PREFIX:avatars}
      banner-prefix: ${CORE_IMAGE_S3_BANNER_PREFIX:banners}
  internal:
    enabled: ${CORE_INTERNAL_ENABLED:false}
    port: ${CORE_INTERNAL_PORT:8082}
    development-http: ${CORE_INTERNAL_DEVELOPMENT_HTTP:false}
    streaming-service-token: ${CORE_STREAMING_SERVICE_TOKEN:}
    streaming-catalog-service-token: ${CORE_STREAMING_CATALOG_SERVICE_TOKEN:}
    tls-keystore: ${CORE_INTERNAL_TLS_KEYSTORE:}
    tls-keystore-password: ${CORE_INTERNAL_TLS_KEYSTORE_PASSWORD:}
  cookie-name: stream_session
  secure-cookie: ${CORE_SECURE_COOKIE:false}
  public-origin: ${WEB_ORIGIN:http://localhost:3000}
  rate-limit-hmac-secret: ${CORE_RATE_LIMIT_HMAC_SECRET}
profile:
  storage-root: ${PROFILE_AVATAR_STORAGE}
  avatar-public-base-url: ${PROFILE_AVATAR_PUBLIC_BASE:/api/profile/avatars}
channels:
  storage-root: ${CHANNELS_BANNER_STORAGE}
  banner-public-base-url: ${CHANNELS_BANNER_PUBLIC_BASE:/api/channels/banners}
