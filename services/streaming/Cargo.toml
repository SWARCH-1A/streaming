[package]
name = "streaming-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "streaming_service"
path = "src/lib.rs"

[[bin]]
name = "streaming-service"
path = "src/main.rs"

[[bin]]
name = "media-adapter"
path = "src/media_adapter_main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
hmac = "0.13.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "rustls-no-provider"] }
rustls = { version = "0.23.0", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.26.1", features = ["serde", "v4", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# High-signal pedantic lints enabled after reviewing the crate-wide noise level.
similar_names = "warn"
unnested_or_patterns = "warn"
# Port implementations keep `impl Future + Send` explicit as part of their API contracts.
manual_async_fn = "allow"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
